name: Desplegar en GitHub Pages

# Publica el menú en GitHub Pages en cada push a main.
# La primera ejecución activa Pages automáticamente (enablement).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues solapados; deja terminar el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto (sitio estático)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
