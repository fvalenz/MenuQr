<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Menú digital de A Mi Antojo: entrada, plato principal, postre y bebidas."
    />
    <meta name="theme-color" content="#0d0d0d" />
    <title>A Mi Antojo · Menú Digital</title>

    <!-- Bootstrap 5.3 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ============ ENCABEZADO ============ -->
    <header class="hero text-center">
      <div class="container">
        <p class="hero__eyebrow">
          <i class="bi bi-egg-fried"></i> Menú de la casa
        </p>
        <h1 class="hero__title">A Mi</h1>
        <p class="hero__script">Antojo</p>
        <div class="hero__divider" aria-hidden="true">
          <span></span><i class="bi bi-suit-heart-fill"></i><span></span>
        </div>
        <p class="hero__subtitle">Cocina casera · Hecho con cariño</p>
      </div>
    </header>

    <!-- ============ MENÚ ============ -->
    <main class="container menu">
      <!-- Las secciones y tarjetas se generan desde js/app.js -->
      <div id="menu-root"></div>
    </main>

    <!-- ============ PIE ============ -->
    <footer class="footer text-center">
      <div class="container">
        <p class="footer__brand">A Mi Antojo</p>
        <p class="footer__note">
          <i class="bi bi-geo-alt-fill"></i> Escanea, elige y disfruta
        </p>
        <p class="footer__copy">&copy; <span id="year"></span> · Menú digital</p>
      </div>
    </footer>

    <!-- Bootstrap JS (bundle con Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <!-- Lógica propia -->
    <script src="js/app.js" defer></script>
  </body>
</html>
