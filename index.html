<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Menú digital de A Mi Antojo: entrada, plato principal, postre y bebidas."
    />
    <meta name="theme-color" content="#0d0d0d" />
    <title>A Mi Antojo · Menú Digital</title>

    <!-- Bootstrap 5.3 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ============ PRELOADER ============ -->
    <div id="preloader" class="preloader" role="status" aria-live="polite" aria-label="Cargando el menú">
      <img class="preloader__logo" src="img/logo.png" alt="" width="900" height="600" />
      <span class="preloader__spinner" aria-hidden="true"></span>
      <p class="preloader__text">Preparando el menú…</p>
    </div>

    <!-- ============ ENCABEZADO ============ -->
    <header class="hero text-center">
      <div class="container">
        <p class="hero__eyebrow fade-in">
          <i class="bi bi-egg-fried"></i> Menú de la casa
        </p>
        <h1 class="hero__logo-wrap fade-in">
          <img
            class="hero__logo"
            src="img/logo.png"
            alt="A Mi Antojo"
            width="900"
            height="600"
          />
        </h1>
        <p class="hero__subtitle fade-in">Cocina casera · Hecho con cariño</p>
      </div>
    </header>

    <!-- ============ MENÚ ============ -->
    <main class="container menu">
      <!-- Las secciones y tarjetas se generan desde js/app.js -->
      <div id="menu-root"></div>
    </main>

    <!-- ============ PIE ============ -->
    <footer class="footer text-center">
      <div class="container">
        <p class="footer__brand fade-in">A Mi Antojo</p>
        <p class="footer__note fade-in">
          <i class="bi bi-geo-alt-fill"></i> Escanea, elige y disfruta
        </p>
        <p class="footer__copy fade-in">&copy; <span id="year"></span> · Menú digital · Realizado por Federico Valenzuela</p>
      </div>
    </footer>

    <!-- Bootstrap JS (bundle con Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <!-- Lógica propia -->
    <script src="js/app.js" defer></script>
  </body>
</html>
